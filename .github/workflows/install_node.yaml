name: Node.js CI

on:
  push:
    branches:
      - develop
jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '18'
        - name: Install dependencies
          run: npm install
        - name: Run tests
          run: npm test #This step will get failed because test cases are not configured here.